<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWEN News Broadcast</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;600&family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body>

    <div class="tv-bezel">
        <div class="crt-screen">
            
            <div class="scanlines"></div>
            <div class="glare"></div>

            <div class="broadcast-layout">
                
                <!-- LEFT SIDEBAR -->
                <div class="sidebar">
                    <div class="sidebar-header">
                        <span><i class="fa-solid fa-list"></i> BROADCAST QUEUE</span>
                    </div>
                    
                    <div class="upcoming-list" id="upcoming-list">
                        <!-- Populated by JS -->
                    </div>
                    
                    <!-- BOTTOM-LEFT WEATHER WIDGET -->
                    <div class="weather-widget">
                        <div class="weather-header"><i class="fa-solid fa-earth-americas"></i> GLOBAL WEATHER</div>
                        <div class="weather-content">
                            <span id="weather-city">LOADING...</span>
                            <span id="weather-temp">--°C</span>
                        </div>
                    </div>
                </div>

                <!-- MAIN DISPLAY STORY -->
                <div class="main-story">
                    <!-- TOP-RIGHT BRANDING LOGO -->
                    <div class="swen-logo">
                        SWEN <span>NEWS</span>
                    </div>

                    <div class="story-image-container">
                        <img id="news-image" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop" alt="News Image">
                        <div class="image-overlay"></div>
                    </div>
                    
                    <div class="story-content">
                        <div class="meta-tags">
                            <span class="category-badge" id="news-category">LOADING</span>
                            <span class="source-badge" id="news-source">NETWORK</span>
                        </div>
                        
                        <h1 id="news-headline">Establishing satellite link...</h1>
                        
                        <p id="news-description">Please stand by as we aggregate global data feeds from verified sources.</p>
                        <div class="timestamp" id="news-time">00:00</div>
                    </div>

                    <div class="source-citation" id="source-citation">
                        Authenticating source data...
                    </div>
                </div>

            </div>

            <!-- BROADCAST TICKER TAPE -->
            <div class="ticker-tape">
                <div class="ticker-text" id="ticker-text">
                    SWEN NEWS NETWORK /// INITIALIZING GLOBAL NODES /// STAND BY...
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
