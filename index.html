<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60Smart Space Broadcast</title>
    <!-- Fonts: Orbitron for Logo only, Inter for crisp, readable UI -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS: Premium Broadcast Space Design */
        :root {
            --bg-dark: #040b18; 
            --bg-panel: rgba(7, 12, 25, 0.85); 
            --accent: #2563eb; 
            --accent-glow: rgba(37, 99, 235, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --blue-dark: #0a2540;
            --blue-light: #0077ff;
            --blue-glow: rgba(0, 119, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif; 
        }

        /* --- CUSTOM SCROLLBAR FOR PREMIUM APP FEEL --- */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--blue-light);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ffffff;
        }
        /* Firefox scrollbar support */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--blue-light) rgba(0, 0, 0, 0.2);
        }

        .broadcast-container {
            display: flex;
            height: calc(100vh - 60px); /* Adjusted for thicker 60px bottom ticker */
            width: 100%;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 340px;
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(37, 99, 235, 0.3);
            z-index: 50;
            position: relative;
            flex-shrink: 0;
        }

        .brand-container {
            padding: 25px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.3);
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 2.5vw, 2.5rem);
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .brand-logo span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .weather-widget {
            padding: 15px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
        }

        .weather-city {
            font-size: clamp(0.85rem, 1vw, 1rem);
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .weather-temp {
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .queue-container {
            flex: 1;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow-y: auto; /* Scrollable list when overflowed */
        }

        .queue-header {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .queue-list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .queue-item { opacity: 0.5; transition: opacity 0.3s; }
        .queue-item.active {
            opacity: 1;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin-left: -13px;
        }
        
        .queue-source { 
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem; 
            font-weight: 800;
            color: var(--accent); 
            margin-bottom: 4px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .network-logo {
            max-height: 14px;
            max-width: 60px;
            filter: brightness(0) invert(1);
            object-fit: contain; 
        }

        .queue-title {
            font-size: 0.9rem; font-weight: 600; line-height: 1.3;
            color: #e2e8f0;
        }

        .queue-smoke-overlay {
            position: sticky;
            bottom: 0; left: 0; right: 0;
            height: 40px;
            background: linear-gradient(to top, rgba(7, 12, 25, 1) 15%, transparent 100%);
            pointer-events: none;
            z-index: 10;
            margin-top: -40px;
        }

        /* --- MAIN CONTENT (SPACE STAGE) --- */
        .main-stage {
            flex: 1;
            position: relative;
            background-color: transparent;
            overflow-y: auto; /* Enables reading full content smoothly */
            display: flex;
            flex-direction: column;
        }

        #space-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* The Black Hole */
        .bh-container {
            position: absolute;
            top: 28%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5; 
            opacity: 0.85;
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .bh-core {
            width: 120px;
            height: 120px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 50px 15px var(--accent-glow), inset 0 0 20px 2px rgba(37, 99, 235, 0.8);
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .bh-core.pulse {
            box-shadow: 0 0 150px 40px rgba(255, 255, 255, 0.8), inset 0 0 40px 10px var(--accent);
            transform: translate(-50%, -50%) scale(1.15);
        }

        .bh-accretion-disk {
            width: 350px;
            height: 350px;
            position: absolute;
            top: 50%; left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(37, 99, 235, 0.1);
            border-left: 4px solid rgba(37, 99, 235, 0.6);
            border-right: 4px solid rgba(37, 99, 235, 0.6);
            box-shadow: 0 0 25px 2px var(--accent-glow);
            animation: spinDisk 4s linear infinite;
        }

        @keyframes spinDisk {
            from { transform: translate(-50%, -50%) rotateX(76deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(76deg) rotateZ(360deg); }
        }

        /* --- SATELLITE ANIMATION --- */
        .orbit-system {
            position: absolute;
            top: 28%; 
            left: 50%;
            width: 380px; height: 380px;
            transform: translate(-50%, -50%) rotateX(76deg);
            z-index: 10;
            transform-style: preserve-3d;
            animation: orbitAnim 12s linear infinite;
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .satellite-obj {
            position: absolute;
            top: -30px; left: 50%;
            width: 60px; height: 60px;
            margin-left: -30px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Hubble_Space_Telescope_model.png/320px-Hubble_Space_Telescope_model.png') no-repeat center/contain;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.9)) brightness(1.4) contrast(1.2);
            animation: counterRotate 12s linear infinite;
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        @keyframes orbitAnim { 0% { transform: translate(-50%, -50%) rotateX(76deg) rotateZ(0deg); } 100% { transform: translate(-50%, -50%) rotateX(76deg) rotateZ(360deg); } }
        @keyframes counterRotate { 0% { transform: rotateZ(0deg) rotateX(-76deg); } 100% { transform: rotateZ(-360deg) rotateX(-76deg); } }

        .satellite-obj.swoop-in {
            transform: scale(4.5) translate(10px, -40px) !important;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9)) drop-shadow(0 0 15px rgba(255, 255, 255, 0.3)) brightness(1.6) contrast(1.3) !important;
        }

        /* Content Display Area */
        .story-content {
            margin-top: auto;
            position: relative;
            width: 100%;
            padding: 40px 60px;
            z-index: 20; 
            transition: opacity 0.5s ease, transform 0.5s ease;
            background: linear-gradient(to top, rgba(4,11,24,0.98) 30%, rgba(4,11,24,0.6) 80%, transparent 100%);
        }

        .story-tags { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        
        .tag { 
            background: var(--blue-light);
            color: #ffffff;
            padding: 5px 12px; 
            font-size: 0.8rem; 
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase; 
            border-radius: 4px; 
            box-shadow: 0 0 10px var(--blue-glow);
        }
        
        .main-logo-container {
            display: flex; align-items: center;
        }

        .main-network-logo {
            max-height: 24px;
            max-width: 120px;
            object-fit: contain; 
            filter: brightness(0) invert(1);
        }

        .logo-separator {
            margin: 0 10px;
            opacity: 0.4;
            font-weight: 400;
            color: #ffffff;
        }
        
        .network-name-text {
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
        }

        /* Headline: Full and Uncut */
        .story-headline {
            font-size: clamp(1.8rem, 3.2vw, 3rem);
            font-weight: 900; line-height: 1.2; margin-bottom: 18px;
            color: #ffffff;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            display: block; 
            letter-spacing: -0.5px;
        }

        /* Description: Full Unbroken Sentences */
        .story-description {
            font-size: clamp(1.05rem, 1.4vw, 1.35rem); 
            line-height: 1.6; color: #cbd5e1; max-width: 1050px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            display: block; 
            font-weight: 400;
        }

        /* --- THICKER DARK & LIGHT BLUE BREAKING REEL --- */
        .tv-ticker {
            height: 60px; /* Thicker area */
            background-color: #030a16;
            display: flex;
            align-items: center;
            z-index: 60;
            border-top: 2px solid var(--blue-light);
            box-shadow: 0 -5px 25px rgba(0, 119, 255, 0.25);
        }

        .ticker-label {
            background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-light) 100%);
            color: #ffffff;
            font-weight: 900;
            font-size: 1.15rem;
            padding: 0 30px;
            height: 100%;
            display: flex;
            align-items: center;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            z-index: 2;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .ticker-label::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            border-right: 2px solid #ffffff;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        .ticker-scroll {
            flex: 1;
            padding: 0 25px;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .ticker-text {
            transition: opacity 0.3s ease;
            letter-spacing: 0.5px;
        }

        /* --- MOBILE & APK OPTIMIZATION --- */
        @media (max-width: 900px) {
            .broadcast-container {
                flex-direction: column;
                height: calc(100vh - 55px);
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                flex-direction: column;
                border-right: none;
                border-bottom: 1px solid rgba(37, 99, 235, 0.3);
                background: rgba(4, 11, 24, 0.95);
            }
            .brand-container {
                padding: 15px 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .weather-widget {
                padding: 10px 20px;
                background: rgba(0, 0, 0, 0.2);
            }
            .queue-container {
                max-height: 200px; /* Let phone users scroll through upcoming items */
                padding: 15px 20px;
            }
            
            .main-stage {
                min-height: 450px;
                overflow-y: visible;
            }

            /* Adjust visual centerpieces for mobile */
            .bh-container { top: 120px; transform: translate(-50%, -50%) scale(0.55); }
            .orbit-system { top: 120px; transform: translate(-50%, -50%) rotateX(76deg) scale(0.55); }
            
            /* Remove extra blank top padding on phone screens */
            .story-content {
                padding: 20px;
                margin-top: 180px; /* Ensures text starts clearly under background animations */
                background: linear-gradient(to top, rgba(4,11,24,1) 85%, transparent 100%);
            }

            .story-headline {
                font-size: 1.5rem;
                margin-bottom: 10px;
            }

            .story-description {
                font-size: 1rem;
                line-height: 1.5;
            }

            .tv-ticker { height: 55px; }
            .ticker-label { font-size: 0.95rem; padding: 0 15px; }
            .ticker-scroll { font-size: 0.95rem; padding: 0 12px;}
        }
    </style>
</head>
<body>

    <div class="broadcast-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand-container">
                <div class="brand-logo">60<span>Smart</span></div>
            </div>
            
            <div class="weather-widget">
                <div class="weather-city" id="weather-city">SYSTEM CHECK</div>
                <div class="weather-temp" id="weather-temp-container">
                    <i id="weather-icon" class="fa-solid fa-satellite-dish" style="color: #ffffff;"></i>
                    <span id="weather-temp">ON</span>
                </div>
            </div>

            <div class="queue-container">
                <div class="queue-header">UPCOMING TELEMETRY</div>
                <div class="queue-list-wrapper" id="queue-list">
                    <!-- Queue populates here -->
                </div>
                <div class="queue-smoke-overlay"></div>
            </div>
        </div>

        <!-- Main Content (Space Stage) -->
        <div class="main-stage">
            
            <!-- Canvas Starfield -->
            <canvas id="space-canvas"></canvas>

            <!-- Black Hole Background -->
            <div class="bh-container">
                <div class="bh-accretion-disk"></div>
                <div class="bh-core" id="bh-core"></div>
            </div>

            <!-- Orbiting Satellite -->
            <div class="orbit-system">
                <div class="satellite-obj" id="satellite-anim"></div>
            </div>

            <!-- Text Content Array -->
            <div class="story-content" id="story-content">
                <div class="story-tags">
                    <span class="tag category" id="main-category">SYSTEM</span>
                    <div class="main-logo-container" id="main-source">
                        <span class="network-name-text">NETWORK</span>
                    </div>
                </div>
                <h1 class="story-headline" id="main-headline">Initializing Neural Network...</h1>
                <p class="story-description" id="main-description">Calibrating spatial sensors and aggregating global data feeds.</p>
            </div>
        </div>
    </div>

    <!-- Dark & Light Blue Bottom Ticker -->
    <div class="tv-ticker">
        <div class="ticker-label">BREAKING</div>
        <div class="ticker-scroll">
            <div class="ticker-text" id="ticker-text">60SMART NETWORK | INITIALIZING DATABANKS</div>
        </div>
    </div>

    <!-- Javascript -->
    <script>
        // --- REAL NETWORK LOGOS DICTIONARY ---
        const sourceLogos = {
            'BBC': 'https://upload.wikimedia.org/wikipedia/commons/6/62/BBC_News_2019.svg',
            'THE GUARDIAN': 'https://upload.wikimedia.org/wikipedia/commons/7/75/The_Guardian_2018.svg',
            'AL JAZEERA': 'https://upload.wikimedia.org/wikipedia/commons/f/fa/Al_Jazeera_English_logo.svg',
            'CNN': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/CNN.svg',
            'FOX NEWS': 'https://upload.wikimedia.org/wikipedia/commons/6/67/Fox_News_Channel_logo.svg',
            'CBS NEWS': 'https://upload.wikimedia.org/wikipedia/commons/1/19/CBS_News_logo.svg',
            'WALL ST JOURNAL': 'https://upload.wikimedia.org/wikipedia/commons/f/f9/The_Wall_Street_Journal_Logo.svg',
            'CNBC MARKETS': 'https://upload.wikimedia.org/wikipedia/commons/e/e3/CNBC_logo.svg',
            'MARKETWATCH': 'https://upload.wikimedia.org/wikipedia/commons/b/b3/MarketWatch_Logo.svg',
            'NY TIMES': 'https://upload.wikimedia.org/wikipedia/commons/5/58/NewYorkTimes.svg',
            'WIRED SCIENCE': 'https://upload.wikimedia.org/wikipedia/commons/8/87/WIRED_logo.svg',
            'NASA': 'https://upload.wikimedia.org/wikipedia/commons/e/e5/NASA_logo.svg',
            'TECHCRUNCH': 'https://upload.wikimedia.org/wikipedia/commons/b/b9/TechCrunch_logo.svg',
            'THE VERGE': 'https://upload.wikimedia.org/wikipedia/commons/a/af/The_Verge_logo.svg',
            'POLYGON': 'https://upload.wikimedia.org/wikipedia/commons/8/82/Polygon_logo.svg'
        };

        // --- CANVAS SPACE BACKGROUND ---
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        const stage = document.querySelector('.main-stage');
        let stars = [];

        function resizeCanvas() {
            canvas.width = stage.clientWidth;
            canvas.height = stage.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function createStars(count) {
            stars = [];
            const starColors = ['#ffffff', '#ffffff', '#e0f0ff', '#b3d4ff'];
            for(let i=0; i<count; i++){
                let size = Math.random() < 0.95 ? Math.random() * 0.8 + 0.2 : Math.random() * 1.5 + 0.8;
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 0.05 + 0.01,
                    size: size,
                    color: starColors[Math.floor(Math.random() * starColors.length)],
                    alpha: Math.random(),
                    alphaChange: (Math.random() * 0.01 + 0.002) * (Math.random() > 0.5 ? 1 : -1)
                });
            }
        }

        function drawSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for(const s of stars){
                s.alpha += s.alphaChange;
                if(s.alpha <= 0.05) { s.alpha = 0.05; s.alphaChange *= -1; }
                if(s.alpha >= 1) { s.alpha = 1; s.alphaChange *= -1; }

                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = s.color;
                
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
                
                s.y += s.speed;
                if(s.y > canvas.height){
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }
        }

        createStars(800);
        (function animateSpace(){
            drawSpace();
            requestAnimationFrame(animateSpace);
        })();

        // --- NEWS BROADCAST LOGIC ---
        const feeds = [
            { url: 'http://feeds.bbci.co.uk/news/world/rss.xml', category: 'WORLD', source: 'BBC' },
            { url: 'https://www.theguardian.com/world/rss', category: 'GLOBAL', source: 'THE GUARDIAN' },
            { url: 'https://www.aljazeera.com/xml/rss/all.xml', category: 'WORLD', source: 'AL JAZEERA' },
            { url: 'https://rss.cnn.com/rss/edition_world.rss', category: 'WORLD', source: 'CNN' },
            { url: 'https://moxie.foxnews.com/google-publisher/world.xml', category: 'WORLD', source: 'FOX NEWS' },
            { url: 'https://www.cbsnews.com/latest/rss/world', category: 'WORLD', source: 'CBS NEWS' },
            { url: 'https://feeds.a.dj.com/rss/RSSMarketsMain.xml', category: 'ECONOMY', source: 'WALL ST JOURNAL' },
            { url: 'https://www.cnbc.com/id/10000664/device/rss/rss.html', category: 'FINANCE', source: 'CNBC MARKETS' },
            { url: 'http://feeds.marketwatch.com/marketwatch/topstories/', category: 'MARKETS', source: 'MARKETWATCH' },
            { url: 'https://rss.nytimes.com/services/xml/rss/nyt/Science.xml', category: 'SCIENCE', source: 'NY TIMES' },
            { url: 'https://www.wired.com/feed/category/science/latest/rss', category: 'RESEARCH', source: 'WIRED SCIENCE' },
            { url: 'https://www.nasa.gov/feeds/iotd-feed/', category: 'SPACE', source: 'NASA' },
            { url: 'https://techcrunch.com/feed/', category: 'TECH', source: 'TECHCRUNCH' },
            { url: 'https://www.theverge.com/rss/index.xml', category: 'TECHNOLOGY', source: 'THE VERGE' },
            { url: 'https://www.polygon.com/rss/index.xml', category: 'GAMING', source: 'POLYGON' }
        ];

        let newsLibrary = [];
        let currentIndex = 0;
        let broadcastTimer; 
        const rss2jsonProxy = 'https://api.rss2json.com/v1/api.json?rss_url=';

        // --- WEATHER CITIES ---
        const weatherCities = [
            { name: "KABUL", lat: 34.5281, lon: 69.1171 },
            { name: "HERAT", lat: 34.3419, lon: 62.2031 },
            { name: "KANDAHAR", lat: 31.6133, lon: 65.7101 },
            { name: "MAZAR-I-SHARIF", lat: 36.7068, lon: 67.1103 },
            { name: "JALALABAD", lat: 34.4264, lon: 70.4515 },
            { name: "TOKYO", lat: 35.6762, lon: 139.6503 },
            { name: "NEW YORK", lat: 40.7128, lon: -74.0060 },
            { name: "LONDON", lat: 51.5074, lon: -0.1278 },
            { name: "PARIS", lat: 48.8566, lon: 2.3522 },
            { name: "DUBAI", lat: 25.2048, lon: 55.2708 },
            { name: "SYDNEY", lat: -33.8688, lon: 151.2093 },
            { name: "SINGAPORE", lat: 1.3521, lon: 103.8198 },
            { name: "BERLIN", lat: 52.5200, lon: 13.4050 },
            { name: "TORONTO", lat: 43.6532, lon: -79.3832 },
            { name: "BEIJING", lat: 39.9042, lon: 116.4074 }
        ];
        let weatherIndex = 0;

        async function fetchWithTimeout(resource, options = { timeout: 5000 }) {
            const { timeout = 5000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        function getWeatherIconHTML(code) {
            if (code === 0) return '<i class="fa-solid fa-sun" style="color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.5);"></i>'; 
            if (code >= 1 && code <= 3) return '<i class="fa-solid fa-cloud-sun" style="color: #FDB813;"></i>'; 
            if (code >= 51 && code <= 65) return '<i class="fa-solid fa-cloud-rain" style="color: #3B82F6;"></i>'; 
            if (code >= 71 && code <= 77) return '<i class="fa-solid fa-snowflake" style="color: #93C5FD;"></i>'; 
            return '<i class="fa-solid fa-cloud" style="color: #9CA3AF;"></i>'; 
        }

        async function fetchWeather() {
            const city = weatherCities[weatherIndex];
            try {
                const res = await fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true`, { timeout: 4000 });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('weather-city').innerText = city.name;
                    document.getElementById('weather-temp-container').innerHTML = `
                        ${getWeatherIconHTML(data.current_weather.weathercode)}
                        <span id="weather-temp">${Math.round(data.current_weather.temperature)}°C</span>
                    `;
                }
            } catch (e) { console.warn("Weather fetch skipped"); }
            
            weatherIndex = (weatherIndex + 1) % weatherCities.length;
        }

        // --- SENTENCE CLEANING FUNCTION: REMOVES [...] AND INCOMPLETE SENTENCES ---
        function cleanSentenceFormat(rawText) {
            if (!rawText) return "Detailed report available on official network site.";
            
            // 1. Strip all HTML tags
            let clean = rawText.replace(/<[^>]+>/g, '').trim();
            
            // 2. Remove [...] or ... trailing patterns
            clean = clean.replace(/\[\.\.\.\]/g, '').replace(/\.\.\./g, '').trim();

            // 3. Cut off at the last valid sentence terminal (. ! ?)
            const match = clean.match(/.*[.!?]/s);
            if (match && match[0].length > 20) {
                return match[0].trim();
            }
            
            return clean ? clean + "." : "Detailed report available on official network site.";
        }

        let tickerItems = [];
        let currentTickerIndex = 0;
        function rotateTicker() {
            if (tickerItems.length === 0) return;
            const tickerEl = document.getElementById('ticker-text');
            tickerEl.style.opacity = 0; 
            setTimeout(() => {
                tickerEl.innerHTML = `${tickerItems[currentTickerIndex]} &nbsp;&bull;&nbsp; STAND BY FOR MORE`;
                tickerEl.style.opacity = 1;
                currentTickerIndex = (currentTickerIndex + 1) % tickerItems.length;
            }, 300); 
        }

        function updateScreen() {
            if (newsLibrary.length === 0) return;

            const article = newsLibrary[currentIndex];
            const contentEl = document.getElementById('story-content');
            const satEl = document.getElementById('satellite-anim');
            const bhCore = document.getElementById('bh-core');

            // 1. Fade out current text
            contentEl.style.opacity = 0;
            contentEl.style.transform = 'translateY(15px)';

            // 2. Satellite breaks orbit and swoops in
            satEl.classList.add('swoop-in');

            // 3. Update screen info
            setTimeout(() => {
                bhCore.classList.add('pulse');
                setTimeout(() => bhCore.classList.remove('pulse'), 300);

                document.getElementById('main-category').innerText = article.category;
                
                const sourceUpper = article.source.toUpperCase();
                if (sourceLogos[sourceUpper]) {
                    document.getElementById('main-source').innerHTML = `
                        <img src="${sourceLogos[sourceUpper]}" class="main-network-logo" alt="${article.source}" onerror="this.style.display='none';" />
                        <span class="logo-separator">|</span>
                        <span class="network-name-text">${article.source}</span>
                    `;
                } else {
                    document.getElementById('main-source').innerHTML = `<span class="network-name-text">${article.source}</span>`;
                }

                document.getElementById('main-headline').innerText = article.title;
                document.getElementById('main-description').innerText = article.description;
                
                // Update Sidebar Queue
                let queueHTML = '';
                const len = newsLibrary.length;
                const indices = [ currentIndex, (currentIndex + 1) % len, (currentIndex + 2) % len, (currentIndex + 3) % len, (currentIndex + 4) % len, (currentIndex + 5) % len, (currentIndex + 6) % len ];
                
                indices.forEach((idx, i) => {
                    let a = newsLibrary[idx];
                    let activeClass = (i === 0) ? 'active' : '';
                    let srcUpper = a.source.toUpperCase();
                    
                    let logoHTML = sourceLogos[srcUpper] 
                        ? `<img src="${sourceLogos[srcUpper]}" class="network-logo" alt="${a.source}" onerror="this.style.display='none';"/> <span class="logo-separator" style="margin:0 6px;">|</span> <span class="network-name-text" style="font-size:0.7rem;">${a.source}</span>`
                        : `<span class="network-name-text" style="font-size:0.7rem;">${a.source}</span>`;

                    queueHTML += `
                        <div class="queue-item ${activeClass}">
                            <div class="queue-source">${logoHTML} &nbsp;&bull;&nbsp; ${a.category}</div>
                            <div class="queue-title">${a.title}</div>
                        </div>`;
                });
                document.getElementById('queue-list').innerHTML = queueHTML;

                // Fade text back in
                contentEl.style.opacity = 1;
                contentEl.style.transform = 'translateY(0)';
                
                satEl.classList.remove('swoop-in');

            }, 1000); 
        }

        async function fetchAllNews() {
            const headEl = document.getElementById('main-headline');
            if (headEl && newsLibrary.length === 0) { headEl.innerText = "CONNECTING TO GLOBAL FEEDS..."; }
            
            const shuffledFeeds = feeds.sort(() => 0.5 - Math.random()).slice(0, 8);
            let allArticles = [];

            for (const feed of shuffledFeeds) {
                try {
                    const response = await fetchWithTimeout(rss2jsonProxy + encodeURIComponent(feed.url), { timeout: 5000 });
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'ok') {
                            const items = data.items.slice(0, 4).map(item => {
                                // Apply the sentence cleaner here:
                                let cleanDesc = cleanSentenceFormat(item.description);

                                return {
                                    title: item.title,
                                    description: cleanDesc,
                                    category: feed.category,
                                    source: feed.source
                                };
                            });
                            allArticles.push(...items);
                        }
                    }
                } catch (error) { console.warn(`Skipped feed ${feed.source}`); }
            }

            if (allArticles.length > 0) {
                newsLibrary = allArticles.sort(() => Math.random() - 0.5);
                tickerItems = newsLibrary.map(a => `${a.source.toUpperCase()}: ${a.title}`);
                currentIndex = 0; 
                
                updateScreen();
                setInterval(rotateTicker, 5000); 

                if (broadcastTimer) clearInterval(broadcastTimer);
                broadcastTimer = setInterval(() => {
                    if (newsLibrary.length > 0) {
                        currentIndex = (currentIndex + 1) % newsLibrary.length;
                        updateScreen();
                    }
                }, 15000); 
            } else if (newsLibrary.length === 0) {
                if (headEl) headEl.innerText = "RETRIEVING NEWS FEEDS...";
                setTimeout(fetchAllNews, 15000); 
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 15000); 
        setInterval(fetchAllNews, 1800000);
        fetchAllNews();

    </script>
</body>
