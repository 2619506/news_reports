<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60Smart Network Broadcast</title>
    <!-- Professional Broadcast Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS: 60Smart Dark Blue Broadcast Design */
        :root {
            --bg-deep: #020813;
            --bg-panel: rgba(6, 17, 38, 0.85); 
            --accent-blue: #0066ff; 
            --accent-glow: rgba(0, 102, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --alert-red: #ff2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; 
            font-family: 'Montserrat', sans-serif;
        }

        body {
            width: 1280px;
            height: 720px;
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .broadcast-container {
            display: flex;
            height: 680px;
            width: 100%;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 360px;
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(0, 102, 255, 0.2);
            z-index: 50;
            position: relative;
        }

        .brand-container {
            padding: 25px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.3);
        }

        .brand-logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .brand-logo span {
            color: var(--accent-blue);
        }

        .weather-widget {
            padding: 15px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-city {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .weather-temp {
            font-size: 1.6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .queue-container {
            flex: 1;
            padding: 15px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .queue-header {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .queue-list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .queue-item { opacity: 0.4; transition: opacity 0.3s; }
        .queue-item.active {
            opacity: 1;
            border-left: 4px solid var(--accent-blue);
            padding-left: 10px;
            margin-left: -14px;
            background: linear-gradient(90deg, rgba(0, 102, 255, 0.15) 0%, transparent 100%);
        }
        
        /* Network Logos Styling */
        .network-logo {
            height: 16px;
            background-color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            object-fit: contain;
            margin-bottom: 6px;
            display: inline-block;
        }

        .queue-title {
            font-size: 0.9rem; font-weight: 500; line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            color: var(--text-main);
        }

        /* Sidebar Fade effect */
        .queue-smoke-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 90px;
            background: linear-gradient(to top, rgba(6, 17, 38, 1) 10%, transparent 100%);
            pointer-events: none;
            z-index: 10;
        }

        /* --- MAIN CONTENT (SPACE STAGE) --- */
        .main-stage {
            flex: 1;
            position: relative;
            background-color: var(--bg-deep);
            overflow: hidden;
        }

        #space-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* The Black Hole */
        .bh-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .bh-core {
            width: 130px;
            height: 130px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 60px 15px var(--accent-glow), inset 0 0 20px 2px rgba(0, 102, 255, 0.8);
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .bh-accretion-disk {
            width: 380px;
            height: 380px;
            position: absolute;
            top: 50%; left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(0, 102, 255, 0.1);
            border-left: 3px solid rgba(0, 102, 255, 0.6);
            border-right: 3px solid rgba(0, 102, 255, 0.6);
            box-shadow: 0 0 25px 2px var(--accent-glow);
            animation: spinDisk 4s linear infinite;
        }

        @keyframes spinDisk {
            from { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(360deg); }
        }

        /* Orbiting Satellites (Visual Only) */
        .satellite-orbit-path {
            position: absolute;
            top: 50%; left: 50%;
            width: 480px; height: 480px;
            transform: translate(-50%, -50%);
            animation: orbitSpin 15s linear infinite;
            z-index: 12;
        }
        .satellite-orbit-path.delayed { animation: orbitSpin 20s linear infinite reverse; }
        
        .orbit-sat {
            position: absolute;
            top: -15px; left: 50%;
            color: #88bbff;
            font-size: 1.5rem;
            transform: translateX(-50%);
            filter: drop-shadow(0 0 8px rgba(136,187,255,0.5));
        }

        @keyframes orbitSpin {
            from { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg); }
        }

        /* Transition Satellite (Shoots at the screen) */
        .transition-sat {
            position: absolute;
            left: 50%; top: 45%;
            color: #ffffff;
            font-size: 3rem;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            z-index: 100;
            filter: drop-shadow(0 0 30px var(--accent-blue));
        }

        @keyframes satDive {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(5); opacity: 1; }
            60% { transform: translate(-50%, -50%) scale(5); opacity: 1; }
            100% { transform: translate(-50%, 600px) scale(15); opacity: 0; }
        }

        /* Text Content Area */
        .story-content {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 40px 60px;
            z-index: 15;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .story-tags { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
        
        .tag-category { 
            background: rgba(0, 102, 255, 0.2);
            border: 1px solid rgba(0, 102, 255, 0.5);
            color: #ffffff;
            padding: 6px 14px; 
            font-size: 0.8rem; 
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase; 
            border-radius: 4px; 
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.2);
        }

        .main-network-logo {
            height: 28px;
            background-color: #ffffff;
            padding: 4px 10px;
            border-radius: 4px;
            object-fit: contain;
        }

        .story-headline {
            font-size: 2.8rem; font-weight: 800; line-height: 1.15; margin-bottom: 15px;
            color: #ffffff;
            /* Removed extreme glow, replaced with clean drop shadow */
            text-shadow: 2px 3px 6px rgba(0, 0, 0, 0.9);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            letter-spacing: -0.5px;
        }

        .story-description {
            font-size: 1.25rem; line-height: 1.5; color: #e2e8f0; max-width: 800px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            font-weight: 400;
        }

        /* --- TICKER TAPE --- */
        .ticker {
            height: 40px; background-color: #051024; color: #ffffff;
            display: flex; align-items: center; padding: 0 25px;
            font-weight: 600; font-size: 1.05rem; z-index: 60;
            border-top: 2px solid var(--accent-blue);
        }

        .ticker-breaking {
            color: var(--alert-red);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .ticker-logo {
            height: 16px; background: #fff; padding: 1px 4px; border-radius: 3px; vertical-align: middle; margin: 0 8px;
        }
    </style>
</head>
<body>

    <div class="broadcast-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand-container">
                <div class="brand-logo">60<span>Smart</span></div>
            </div>
            
            <div class="weather-widget">
                <div class="weather-city" id="weather-city">SYSTEM CHECK</div>
                <div class="weather-temp">
                    <i id="weather-icon" class="fa-solid fa-satellite-dish"></i>
                    <span id="weather-temp">ON</span>
                </div>
            </div>

            <div class="queue-container">
                <div class="queue-header">UPCOMING IN FEED</div>
                <!-- Queue list increased to 8 items to fill space -->
                <div class="queue-list-wrapper" id="queue-list">
                    <!-- Queue populates here -->
                </div>
                <!-- Smoke/Fade effect -->
                <div class="queue-smoke-overlay"></div>
            </div>
        </div>

        <!-- Main Content (Space Stage) -->
        <div class="main-stage">
            
            <!-- Dark Blue Canvas Starfield -->
            <canvas id="space-canvas"></canvas>

            <!-- Black Hole & Orbiting Satellites -->
            <div class="bh-container">
                <div class="bh-accretion-disk"></div>
                <div class="bh-core" id="bh-core"></div>
                
                <!-- Purely Visual Orbiting Satellites -->
                <div class="satellite-orbit-path">
                    <i class="fa-solid fa-satellite orbit-sat"></i>
                </div>
                <div class="satellite-orbit-path delayed">
                    <i class="fa-solid fa-satellite orbit-sat"></i>
                </div>
            </div>

            <!-- The Transition Satellite (Shoots toward screen) -->
            <i class="fa-solid fa-satellite transition-sat" id="sat-anim"></i>

            <!-- News Text Content -->
            <div class="story-content" id="story-content">
                <div class="story-tags">
                    <span class="tag-category" id="main-category">SYSTEM</span>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/NASA_logo.svg/512px-NASA_logo.svg.png" class="main-network-logo" id="main-source-logo" style="display:none;">
                </div>
                <h1 class="story-headline" id="main-headline">Establishing Global Link...</h1>
                <p class="story-description" id="main-description">Calibrating telemetry systems and fetching worldwide databanks.</p>
            </div>
        </div>
    </div>

    <!-- Bottom Ticker -->
    <div class="ticker">
        <div class="ticker-text" id="ticker-text"><span class="ticker-breaking">SYSTEM</span> | INITIALIZING DATABANKS</div>
    </div>

    <!-- Javascript -->
    <script>
        // --- NETWORK LOGO MAPPING ---
        const logoMap = {
            'BBC': 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/BBC_Logo_2021.svg/512px-BBC_Logo_2021.svg.png',
            'THE GUARDIAN': 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/The_Guardian_2018.svg/512px-The_Guardian_2018.svg.png',
            'AL JAZEERA': 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Aljazeera_eng.svg/512px-Aljazeera_eng.svg.png',
            'CNN': 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/CNN.svg/512px-CNN.svg.png',
            'FOX NEWS': 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Fox_News_Channel_logo.svg/512px-Fox_News_Channel_logo.svg.png',
            'CBS NEWS': 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/CBS_News.svg/512px-CBS_News.svg.png',
            'WALL ST JOURNAL': 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/The_Wall_Street_Journal_Logo.svg/512px-The_Wall_Street_Journal_Logo.svg.png',
            'CNBC MARKETS': 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/CNBC_logo.svg/512px-CNBC_logo.svg.png',
            'MARKETWATCH': 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/MarketWatch_logo.svg/512px-MarketWatch_logo.svg.png',
            'NY TIMES': 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/The_New_York_Times_logo.png/512px-The_New_York_Times_logo.png',
            'WIRED SCIENCE': 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Wired_logo.svg/512px-Wired_logo.svg.png',
            'NASA': 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/NASA_logo.svg/512px-NASA_logo.svg.png',
            'TECHCRUNCH': 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/TechCrunch_logo.svg/512px-TechCrunch_logo.svg.png',
            'THE VERGE': 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/The_Verge_logo.svg/512px-The_Verge_logo.svg.png',
            'POLYGON': 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Polygon_logo.svg/512px-Polygon_logo.svg.png'
        };

        // --- DARK BLUE CANVAS SPACE BACKGROUND ---
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        const stage = document.querySelector('.main-stage');
        let stars = [];

        function resizeCanvas() {
            canvas.width = stage.clientWidth;
            canvas.height = stage.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function createStars(count) {
            stars = [];
            // Updated colors to match the nice darker blue theme
            const starColors = ['#ffffff', '#aaddff', '#66aaff', '#4488ff'];
            for(let i=0; i<count; i++){
                let size = Math.random() < 0.95 ? Math.random() * 0.8 + 0.2 : Math.random() * 1.5 + 0.5;
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 0.05 + 0.01,
                    size: size,
                    color: starColors[Math.floor(Math.random() * starColors.length)],
                    alpha: Math.random(),
                    alphaChange: (Math.random() * 0.01 + 0.002) * (Math.random() > 0.5 ? 1 : -1)
                });
            }
        }

        function drawSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for(const s of stars){
                s.alpha += s.alphaChange;
                if(s.alpha <= 0.05) { s.alpha = 0.05; s.alphaChange *= -1; }
                if(s.alpha >= 1) { s.alpha = 1; s.alphaChange *= -1; }

                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = s.color;
                
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();

                s.y += s.speed;
                if(s.y > canvas.height){
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }
        }

        createStars(700);
        (function animateSpace(){
            drawSpace();
            requestAnimationFrame(animateSpace);
        })();

        // --- NEWS BROADCAST LOGIC ---
        const feeds = [
            { url: 'http://feeds.bbci.co.uk/news/world/rss.xml', category: 'WORLD', source: 'BBC' },
            { url: 'https://www.theguardian.com/world/rss', category: 'GLOBAL', source: 'THE GUARDIAN' },
            { url: 'https://www.aljazeera.com/xml/rss/all.xml', category: 'WORLD', source: 'AL JAZEERA' },
            { url: 'https://rss.cnn.com/rss/edition_world.rss', category: 'WORLD', source: 'CNN' },
            { url: 'https://moxie.foxnews.com/google-publisher/world.xml', category: 'WORLD', source: 'FOX NEWS' },
            { url: 'https://www.cbsnews.com/latest/rss/world', category: 'WORLD', source: 'CBS NEWS' },
            { url: 'https://feeds.a.dj.com/rss/RSSMarketsMain.xml', category: 'ECONOMY', source: 'WALL ST JOURNAL' },
            { url: 'https://www.cnbc.com/id/10000664/device/rss/rss.html', category: 'FINANCE', source: 'CNBC MARKETS' },
            { url: 'http://feeds.marketwatch.com/marketwatch/topstories/', category: 'MARKETS', source: 'MARKETWATCH' },
            { url: 'https://rss.nytimes.com/services/xml/rss/nyt/Science.xml', category: 'SCIENCE', source: 'NY TIMES' },
            { url: 'https://www.wired.com/feed/category/science/latest/rss', category: 'RESEARCH', source: 'WIRED SCIENCE' },
            { url: 'https://www.nasa.gov/feeds/iotd-feed/', category: 'SPACE', source: 'NASA' },
            { url: 'https://techcrunch.com/feed/', category: 'TECH', source: 'TECHCRUNCH' },
            { url: 'https://www.theverge.com/rss/index.xml', category: 'TECHNOLOGY', source: 'THE VERGE' },
            { url: 'https://www.polygon.com/rss/index.xml', category: 'GAMING', source: 'POLYGON' }
        ];

        let newsLibrary = [];
        let currentIndex = 0;
        let broadcastTimer; 
        const rss2jsonProxy = 'https://api.rss2json.com/v1/api.json?rss_url=';

        const weatherCities = [
            { name: "KABUL", lat: 34.5281, lon: 69.1171 }, { name: "HERAT", lat: 34.3419, lon: 62.2031 },
            { name: "TOKYO", lat: 35.68, lon: 139.69 }, { name: "DUBAI", lat: 25.20, lon: 55.27 },
            { name: "LONDON", lat: 51.50, lon: -0.12 }, { name: "PARIS", lat: 48.85, lon: 2.35 },
            { name: "NEW YORK", lat: 40.71, lon: -74.00 }, { name: "SYDNEY", lat: -33.8688, lon: 151.2093 }
        ];
        weatherCities.sort(() => Math.random() - 0.5);
        let weatherIndex = 0;

        async function fetchWithTimeout(resource, options = { timeout: 5000 }) {
            const { timeout = 5000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        // --- Weather Color Update ---
        function updateWeatherUI(data, city) {
            document.getElementById('weather-city').innerText = city.name;
            document.getElementById('weather-temp').innerText = `${Math.round(data.current_weather.temperature)}°C`;
            const iconEl = document.getElementById('weather-icon');
            const code = data.current_weather.weathercode;
            
            // Dynamic colors based on your request
            if (code === 0) { iconEl.className = 'fa-solid fa-sun'; iconEl.style.color = '#FFD700'; }
            else if (code >= 1 && code <= 3) { iconEl.className = 'fa-solid fa-cloud-sun'; iconEl.style.color = '#cccccc'; }
            else if (code >= 51 && code <= 65) { iconEl.className = 'fa-solid fa-cloud-rain'; iconEl.style.color = '#44aaff'; }
            else if (code >= 71 && code <= 77) { iconEl.className = 'fa-solid fa-snowflake'; iconEl.style.color = '#ffffff'; }
            else { iconEl.className = 'fa-solid fa-cloud'; iconEl.style.color = '#aaaaaa'; }
        }

        async function fetchWeather() {
            const city = weatherCities[weatherIndex];
            try {
                const res = await fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true`, { timeout: 4000 });
                if (res.ok) {
                    const data = await res.json();
                    updateWeatherUI(data, city);
                }
            } catch (e) { console.warn("Weather fetch skipped"); }
            weatherIndex = (weatherIndex + 1) % weatherCities.length;
        }

        let tickerItems = [];
        let currentTickerIndex = 0;
        function rotateTicker() {
            if (tickerItems.length === 0) return;
            const tickerEl = document.getElementById('ticker-text');
            tickerEl.style.opacity = 0; 
            setTimeout(() => {
                const item = tickerItems[currentTickerIndex];
                const logoUrl = logoMap[item.source] || '';
                let logoHTML = logoUrl ? `<img src="${logoUrl}" class="ticker-logo">` : ` ${item.source}: `;
                
                tickerEl.innerHTML = `<span class="ticker-breaking">BREAKING</span> &nbsp;|&nbsp; ${logoHTML} ${item.title}`;
                tickerEl.style.opacity = 1;
                currentTickerIndex = (currentTickerIndex + 1) % tickerItems.length;
            }, 300); 
        }

        function updateScreen() {
            if (newsLibrary.length === 0) return;

            const article = newsLibrary[currentIndex];
            const contentEl = document.getElementById('story-content');
            const satEl = document.getElementById('sat-anim');

            // 1. Fade out current text
            contentEl.style.opacity = 0;
            contentEl.style.transform = 'translateY(20px)';

            // 2. Launch the satellite out from the black hole toward the screen
            satEl.style.animation = 'none';
            void satEl.offsetWidth; 
            satEl.style.animation = 'satDive 1.5s ease-in-out forwards';

            // 3. Swap text halfway through the satellite animation (when it covers the screen)
            setTimeout(() => {
                
                document.getElementById('main-category').innerText = article.category;
                document.getElementById('main-headline').innerText = article.title;
                document.getElementById('main-description').innerText = article.description;
                
                // Set the Main Stage Logo
                const mainLogoEl = document.getElementById('main-source-logo');
                const logoUrl = logoMap[article.source];
                if(logoUrl) {
                    mainLogoEl.src = logoUrl;
                    mainLogoEl.style.display = 'inline-block';
                } else {
                    mainLogoEl.style.display = 'none';
                }
                
                // Update Sidebar Queue (Increased to 8 to fill empty space)
                let queueHTML = '';
                const len = newsLibrary.length;
                const indices = Array.from({length: 8}, (_, i) => (currentIndex + i) % len);
                
                indices.forEach((idx, i) => {
                    let a = newsLibrary[idx];
                    let activeClass = (i === 0) ? 'active' : '';
                    let sideLogoUrl = logoMap[a.source];
                    let sideSourceHTML = sideLogoUrl 
                        ? `<img src="${sideLogoUrl}" class="network-logo"><br>` 
                        : `<span style="font-weight:700;">${a.source}</span><br>`;

                    queueHTML += `
                        <div class="queue-item ${activeClass}">
                            ${sideSourceHTML}
                            <div class="queue-title">${a.title}</div>
                        </div>`;
                });
                document.getElementById('queue-list').innerHTML = queueHTML;

                // Fade text back in
                contentEl.style.opacity = 1;
                contentEl.style.transform = 'translateY(0)';

            }, 750); // Exactly half-way through the 1.5s animation
        }

        async function fetchAllNews() {
            const headEl = document.getElementById('main-headline');
            if (headEl && newsLibrary.length === 0) { headEl.innerText = "CONNECTING TO GLOBAL FEEDS..."; }
            
            const shuffledFeeds = feeds.sort(() => 0.5 - Math.random()).slice(0, 8);
            let allArticles = [];

            for (const feed of shuffledFeeds) {
                try {
                    const response = await fetchWithTimeout(rss2jsonProxy + encodeURIComponent(feed.url), { timeout: 5000 });
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'ok') {
                            const items = data.items.slice(0, 4).map(item => {
                                let cleanDesc = item.description ? item.description.replace(/<[^>]+>/g, '').trim() : "";
                                if(cleanDesc.length > 300) cleanDesc = cleanDesc.substring(0, 300) + '...';

                                return {
                                    title: item.title,
                                    description: cleanDesc || "Detailed report available on the official network site.",
                                    category: feed.category,
                                    source: feed.source
                                };
                            });
                            allArticles.push(...items);
                        }
                    }
                } catch (error) { console.warn(`Skipped feed ${feed.source}`); }
            }

            if (allArticles.length > 0) {
                newsLibrary = allArticles.sort(() => Math.random() - 0.5);
                tickerItems = newsLibrary.map(a => ({ source: a.source, title: a.title }));
                currentIndex = 0; 
                
                updateScreen();
                setInterval(rotateTicker, 5000); 

                if (broadcastTimer) clearInterval(broadcastTimer);
                broadcastTimer = setInterval(() => {
                    if (newsLibrary.length > 0) {
                        currentIndex = (currentIndex + 1) % newsLibrary.length;
                        updateScreen();
                    }
                }, 15000); 
            } else if (newsLibrary.length === 0) {
                if (headEl) headEl.innerText = "API LIMIT REACHED. RETRYING...";
                setTimeout(fetchAllNews, 30000); 
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 600000); 
        setInterval(fetchAllNews, 1800000);
        fetchAllNews();

    </script>
</body>
</html>
