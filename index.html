<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWEN News Broadcast</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Oswald:wght@500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="broadcast-layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <span><i class="fa-solid fa-list-ul"></i> LIVE QUEUE</span>
            </div>
            <div class="upcoming-list" id="upcoming-list">
                <!-- Javascript populates items here -->
            </div>
            <div class="weather-widget">
                <div class="weather-header"><i class="fa-solid fa-earth-americas"></i> GLOBAL DATABANKS</div>
                <div class="weather-content">
                    <span id="weather-city">LOADING</span>
                    <div class="weather-temp-container">
                        <i id="weather-icon" class="fa-solid fa-cloud"></i>
                        <span id="weather-temp">--°C</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="main-story">
            <div class="swen-logo-container">
                <div class="swen-logo">SWEN <span>NEWS</span></div>
            </div>
            <div class="story-image-container">
                <img id="news-image" src="" alt="">
                <div class="image-overlay"></div>
            </div>
            <div class="story-content">
                <div class="meta-tags">
                    <span class="category-badge" id="news-category">SYSTEM</span>
                    <span class="source-badge" id="news-source">NETWORK</span>
                </div>
                <h1 id="news-headline">Establishing satellite link...</h1>
                <div class="news-full-matter">
                    <p id="news-description">Aggregating global data feeds. Please stand by for transmission.</p>
                </div>
            </div>
        </div>
    </div>
    <div class="ticker-tape">
        <div class="ticker-text" id="ticker-text">
            SWEN NEWS NETWORK | INITIALIZING | STAND BY
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
