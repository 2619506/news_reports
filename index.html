<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60Smart Space Broadcast</title>
    <!-- Fonts: Orbitron for Logo only, Inter for crisp, readable UI -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS: Premium Broadcast Space Design */
        :root {
            --bg-dark: #040b18; 
            --bg-panel: rgba(7, 12, 25, 0.85); 
            --accent: #2563eb; 
            --accent-glow: rgba(37, 99, 235, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --blue-dark: #0a2540;
            --blue-light: #0077ff;
            --blue-glow: rgba(0, 119, 255, 0.5);
            /* New Carousel Cyan Theme from Screenshot */
            --cyan-glow: #64bec8;
            --cyan-border: rgba(75, 204, 255, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif; 
        }

        /* --- CUSTOM SCROLLBAR --- */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: var(--blue-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffffff; }
        * { scrollbar-width: thin; scrollbar-color: var(--blue-light) rgba(0, 0, 0, 0.2); }

        .broadcast-container {
            display: flex;
            height: calc(100vh - 60px); 
            width: 100%;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 340px;
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(37, 99, 235, 0.3);
            z-index: 50;
            position: relative;
            flex-shrink: 0;
        }

        .brand-container {
            padding: 25px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.3);
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 2.5vw, 2.5rem);
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .brand-logo span { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

        .weather-widget {
            padding: 15px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.15);
        }

        .weather-city {
            font-size: clamp(0.85rem, 1vw, 1rem); font-weight: 800; color: #ffffff;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .weather-temp { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 12px; }

        .queue-container {
            flex: 1; padding: 20px 30px; display: flex; flex-direction: column; gap: 12px;
            position: relative; overflow-y: auto; 
        }

        .queue-header {
            font-size: 0.8rem; font-weight: 800; color: var(--text-muted);
            letter-spacing: 1.5px; margin-bottom: 5px; text-transform: uppercase;
        }
        
        .queue-list-wrapper { display: flex; flex-direction: column; gap: 12px; }

        .queue-item { opacity: 0.5; transition: opacity 0.3s; }
        .queue-item.active {
            opacity: 1; border-left: 3px solid var(--cyan-glow);
            padding-left: 10px; margin-left: -13px;
        }
        
        .queue-source { 
            display: flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: 800;
            color: var(--cyan-glow); margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase;
        }

        .network-logo { max-height: 14px; max-width: 60px; filter: brightness(0) invert(1); object-fit: contain; }
        .queue-title { font-size: 0.9rem; font-weight: 600; line-height: 1.3; color: #e2e8f0; }
        .queue-smoke-overlay {
            position: sticky; bottom: 0; left: 0; right: 0; height: 40px;
            background: linear-gradient(to top, rgba(7, 12, 25, 1) 15%, transparent 100%);
            pointer-events: none; z-index: 10; margin-top: -40px;
        }

        /* --- MAIN CONTENT (SPACE STAGE) --- */
        .main-stage {
            flex: 1; position: relative; background-color: transparent;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #space-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        /* --- 3D CAROUSEL CSS --- */
        .carousel-wrapper {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            perspective: 1200px; /* Crucial for 3D depth */
            padding-bottom: 20px;
        }

        .carousel-track {
            position: relative;
            width: 320px;
            height: 420px;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-card {
            position: absolute;
            width: 340px;
            height: 440px;
            background: rgba(4, 11, 24, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 35px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        /* Card Positioning Logic */
        .carousel-card.active {
            opacity: 1;
            transform: translateZ(200px) rotateY(0deg);
            background: linear-gradient(135deg, rgba(75, 204, 255, 0.1), rgba(4, 11, 24, 0.8));
            border: 1px solid var(--cyan-border);
            box-shadow: inset 0 0 40px -10px var(--cyan-glow), 0 20px 50px rgba(0,0,0,0.8);
            pointer-events: auto;
            z-index: 5;
        }

        .carousel-card.prev {
            opacity: 0.4;
            transform: translateX(-75%) translateZ(-100px) rotateY(35deg);
            z-index: 4;
        }

        .carousel-card.next {
            opacity: 0.4;
            transform: translateX(75%) translateZ(-100px) rotateY(-35deg);
            z-index: 4;
        }
        
        .carousel-card.hidden-left { transform: translateX(-120%) translateZ(-300px) rotateY(45deg); opacity: 0; }
        .carousel-card.hidden-right { transform: translateX(120%) translateZ(-300px) rotateY(-45deg); opacity: 0; }

        /* Card Interior Elements */
        .card-logo { max-width: 140px; max-height: 40px; filter: brightness(0) invert(1); margin-bottom: 20px; }
        .card-source-text { font-weight: 800; font-size: 1.1rem; color: var(--cyan-glow); margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; }
        
        .card-title {
            font-size: clamp(1.4rem, 2vw, 1.6rem);
            font-weight: 800;
            line-height: 1.3;
            color: #ffffff;
            margin-bottom: 15px;
            display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .card-category {
            margin-top: auto;
            background: var(--cyan-border);
            color: #fff;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Controls (Match screenshot exactly) */
        .carousel-controls {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-top: 50px;
            z-index: 25;
        }

        .nav-btn {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--cyan-border);
            backdrop-filter: blur(30px);
            border-radius: 50%;
            font-size: 20px;
            box-shadow: inset 0 0 20px -6px var(--cyan-glow), inset 0 0 .5rem -10px var(--cyan-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover { background: rgba(75, 204, 255, 0.2); transform: scale(1.05); }
        .nav-btn:active { transform: scale(0.95); }

        .nav-dots { display: flex; gap: 8px; align-items: center; }
        .dot { 
            width: 8px; height: 8px; border-radius: 50%; 
            background: rgba(255, 255, 255, 0.2); transition: all 0.3s ease; 
        }
        .dot.active { 
            background: var(--cyan-glow); 
            box-shadow: 0 0 10px var(--cyan-glow); 
            transform: scale(1.3); 
        }

        /* --- BOTTOM TICKER --- */
        .tv-ticker {
            height: 60px; background-color: #030a16; display: flex; align-items: center;
            z-index: 60; border-top: 2px solid var(--blue-light); box-shadow: 0 -5px 25px rgba(0, 119, 255, 0.25);
        }
        .ticker-label {
            background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-light) 100%);
            color: #ffffff; font-weight: 900; font-size: 1.15rem; padding: 0 30px; height: 100%;
            display: flex; align-items: center; letter-spacing: 1.5px; text-transform: uppercase;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5); z-index: 2; border-right: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .ticker-label::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-right: 2px solid #ffffff; animation: pulseGlow 2s infinite alternate; }
        @keyframes pulseGlow { from { opacity: 0.3; } to { opacity: 1; } }
        .ticker-scroll { flex: 1; padding: 0 25px; color: #ffffff; font-weight: 700; font-size: 1.1rem; white-space: nowrap; overflow: hidden; display: flex; align-items: center; }
        .ticker-text { transition: opacity 0.3s ease; letter-spacing: 0.5px; }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 900px) {
            .broadcast-container { flex-direction: column; height: calc(100vh - 55px); overflow-y: auto; }
            .sidebar { width: 100%; flex-direction: column; border-right: none; border-bottom: 1px solid rgba(37, 99, 235, 0.3); background: rgba(4, 11, 24, 0.95); }
            .brand-container { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
            .weather-widget { padding: 10px 20px; background: rgba(0, 0, 0, 0.2); }
            .queue-container { max-height: 200px; padding: 15px 20px; }
            
            .main-stage { min-height: 500px; padding-top: 20px; overflow: hidden; }
            
            .carousel-card { width: 260px; height: 350px; padding: 20px; }
            .carousel-card.active { transform: translateZ(120px) rotateY(0deg); }
            .carousel-card.prev { transform: translateX(-65%) translateZ(-150px) rotateY(35deg); }
            .carousel-card.next { transform: translateX(65%) translateZ(-150px) rotateY(-35deg); }
            
            .nav-btn { width: 45px; height: 45px; font-size: 16px; }
            
            .tv-ticker { height: 55px; }
            .ticker-label { font-size: 0.95rem; padding: 0 15px; }
            .ticker-scroll { font-size: 0.95rem; padding: 0 12px;}
        }
    </style>
</head>
<body>

    <div class="broadcast-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand-container">
                <div class="brand-logo">60<span>Smart</span></div>
            </div>
            
            <div class="weather-widget">
                <div class="weather-city" id="weather-city">SYSTEM CHECK</div>
                <div class="weather-temp" id="weather-temp-container">
                    <i id="weather-icon" class="fa-solid fa-satellite-dish" style="color: #ffffff;"></i>
                    <span id="weather-temp">ON</span>
                </div>
            </div>

            <div class="queue-container">
                <div class="queue-header">UPCOMING TELEMETRY</div>
                <div class="queue-list-wrapper" id="queue-list">
                    <!-- Queue populates here -->
                </div>
                <div class="queue-smoke-overlay"></div>
            </div>
        </div>

        <!-- Main Content (Space Stage with 3D Carousel) -->
        <div class="main-stage">
            <canvas id="space-canvas"></canvas>
            
            <div class="carousel-wrapper">
                <div class="carousel-track" id="carousel-track">
                    <!-- Cards will inject here -->
                    <div style="color: white; font-weight: 800;">INITIALIZING DATABANKS...</div>
                </div>
                
                <div class="carousel-controls" id="carousel-controls" style="display: none;">
                    <div class="nav-btn" id="prev-btn" onclick="moveCarousel(-1)"><i class="fa-solid fa-chevron-left"></i></div>
                    <div class="nav-dots" id="nav-dots"></div>
                    <div class="nav-btn" id="next-btn" onclick="moveCarousel(1)"><i class="fa-solid fa-chevron-right"></i></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Ticker -->
    <div class="tv-ticker">
        <div class="ticker-label">BREAKING</div>
        <div class="ticker-scroll">
            <div class="ticker-text" id="ticker-text">60SMART NETWORK | INITIALIZING DATABANKS</div>
        </div>
    </div>

    <!-- Javascript -->
    <script>
        const sourceLogos = {
            'BBC': 'https://upload.wikimedia.org/wikipedia/commons/6/62/BBC_News_2019.svg',
            'THE GUARDIAN': 'https://upload.wikimedia.org/wikipedia/commons/7/75/The_Guardian_2018.svg',
            'AL JAZEERA': 'https://upload.wikimedia.org/wikipedia/commons/f/fa/Al_Jazeera_English_logo.svg',
            'CNN': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/CNN.svg',
            'FOX NEWS': 'https://upload.wikimedia.org/wikipedia/commons/6/67/Fox_News_Channel_logo.svg',
            'CBS NEWS': 'https://upload.wikimedia.org/wikipedia/commons/1/19/CBS_News_logo.svg',
            'WALL ST JOURNAL': 'https://upload.wikimedia.org/wikipedia/commons/f/f9/The_Wall_Street_Journal_Logo.svg',
            'CNBC MARKETS': 'https://upload.wikimedia.org/wikipedia/commons/e/e3/CNBC_logo.svg',
            'MARKETWATCH': 'https://upload.wikimedia.org/wikipedia/commons/b/b3/MarketWatch_Logo.svg',
            'NY TIMES': 'https://upload.wikimedia.org/wikipedia/commons/5/58/NewYorkTimes.svg',
            'WIRED SCIENCE': 'https://upload.wikimedia.org/wikipedia/commons/8/87/WIRED_logo.svg',
            'NASA': 'https://upload.wikimedia.org/wikipedia/commons/e/e5/NASA_logo.svg',
            'TECHCRUNCH': 'https://upload.wikimedia.org/wikipedia/commons/b/b9/TechCrunch_logo.svg',
            'THE VERGE': 'https://upload.wikimedia.org/wikipedia/commons/a/af/The_Verge_logo.svg',
            'POLYGON': 'https://upload.wikimedia.org/wikipedia/commons/8/82/Polygon_logo.svg'
        };

        // --- BACKGROUND STARS ---
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        const stage = document.querySelector('.main-stage');
        let stars = [];

        function resizeCanvas() { canvas.width = stage.clientWidth; canvas.height = stage.clientHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function createStars(count) {
            stars = [];
            const starColors = ['#ffffff', '#ffffff', '#e0f0ff', '#64bec8']; // Added cyan stars to match theme
            for(let i=0; i<count; i++){
                stars.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    speed: Math.random() * 0.05 + 0.01, size: Math.random() < 0.95 ? Math.random() * 0.8 + 0.2 : Math.random() * 1.5 + 0.8,
                    color: starColors[Math.floor(Math.random() * starColors.length)],
                    alpha: Math.random(), alphaChange: (Math.random() * 0.01 + 0.002) * (Math.random() > 0.5 ? 1 : -1)
                });
            }
        }
        function drawSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(const s of stars){
                s.alpha += s.alphaChange;
                if(s.alpha <= 0.05) { s.alpha = 0.05; s.alphaChange *= -1; }
                if(s.alpha >= 1) { s.alpha = 1; s.alphaChange *= -1; }
                ctx.globalAlpha = s.alpha; ctx.fillStyle = s.color;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
                s.y += s.speed;
                if(s.y > canvas.height){ s.y = 0; s.x = Math.random() * canvas.width; }
            }
        }
        createStars(600);
        (function animateSpace(){ drawSpace(); requestAnimationFrame(animateSpace); })();

        // --- NEWS BROADCAST LOGIC ---
        const feeds = [
            { url: 'http://feeds.bbci.co.uk/news/world/rss.xml', category: 'WORLD', source: 'BBC' },
            { url: 'https://www.theguardian.com/world/rss', category: 'GLOBAL', source: 'THE GUARDIAN' },
            { url: 'https://www.aljazeera.com/xml/rss/all.xml', category: 'WORLD', source: 'AL JAZEERA' },
            { url: 'https://rss.cnn.com/rss/edition_world.rss', category: 'WORLD', source: 'CNN' },
            { url: 'https://moxie.foxnews.com/google-publisher/world.xml', category: 'WORLD', source: 'FOX NEWS' },
            { url: 'https://www.cbsnews.com/latest/rss/world', category: 'WORLD', source: 'CBS NEWS' },
            { url: 'https://feeds.a.dj.com/rss/RSSMarketsMain.xml', category: 'ECONOMY', source: 'WALL ST JOURNAL' },
            { url: 'https://www.cnbc.com/id/10000664/device/rss/rss.html', category: 'FINANCE', source: 'CNBC MARKETS' },
            { url: 'https://rss.nytimes.com/services/xml/rss/nyt/Science.xml', category: 'SCIENCE', source: 'NY TIMES' },
            { url: 'https://www.nasa.gov/feeds/iotd-feed/', category: 'SPACE', source: 'NASA' },
            { url: 'https://techcrunch.com/feed/', category: 'TECH', source: 'TECHCRUNCH' },
            { url: 'https://www.theverge.com/rss/index.xml', category: 'TECHNOLOGY', source: 'THE VERGE' }
        ];

        let newsLibrary = [];
        let currentIndex = 0;
        let broadcastTimer; 
        const rss2jsonProxy = 'https://api.rss2json.com/v1/api.json?rss_url=';

        const weatherCities = [
            { name: "KABUL", lat: 34.5281, lon: 69.1171 }, { name: "NEW YORK", lat: 40.7128, lon: -74.0060 },
            { name: "LONDON", lat: 51.5074, lon: -0.1278 }, { name: "TOKYO", lat: 35.6762, lon: 139.6503 }
        ];
        let weatherIndex = 0;

        async function fetchWithTimeout(resource, options = { timeout: 5000 }) {
            const { timeout = 5000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try { const response = await fetch(resource, { ...options, signal: controller.signal }); clearTimeout(id); return response; }
            catch (error) { clearTimeout(id); throw error; }
        }

        function getWeatherIconHTML(code) {
            if (code === 0) return '<i class="fa-solid fa-sun" style="color: #FFD700;"></i>'; 
            if (code >= 1 && code <= 3) return '<i class="fa-solid fa-cloud-sun" style="color: #FDB813;"></i>'; 
            if (code >= 51 && code <= 65) return '<i class="fa-solid fa-cloud-rain" style="color: #64bec8;"></i>'; 
            if (code >= 71 && code <= 77) return '<i class="fa-solid fa-snowflake" style="color: #93C5FD;"></i>'; 
            return '<i class="fa-solid fa-cloud" style="color: #9CA3AF;"></i>'; 
        }

        async function fetchWeather() {
            const city = weatherCities[weatherIndex];
            try {
                const res = await fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true`, { timeout: 4000 });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('weather-city').innerText = city.name;
                    document.getElementById('weather-temp-container').innerHTML = `${getWeatherIconHTML(data.current_weather.weathercode)}<span id="weather-temp">${Math.round(data.current_weather.temperature)}°C</span>`;
                }
            } catch (e) {}
            weatherIndex = (weatherIndex + 1) % weatherCities.length;
        }

        let tickerItems = [];
        let currentTickerIndex = 0;
        function rotateTicker() {
            if (tickerItems.length === 0) return;
            const tickerEl = document.getElementById('ticker-text');
            tickerEl.style.opacity = 0; 
            setTimeout(() => {
                tickerEl.innerHTML = `${tickerItems[currentTickerIndex]} &nbsp;&bull;&nbsp; STAND BY FOR MORE`;
                tickerEl.style.opacity = 1;
                currentTickerIndex = (currentTickerIndex + 1) % tickerItems.length;
            }, 300); 
        }

        // --- NEW CAROUSEL LOGIC ---
        function initializeCarouselDOM() {
            const track = document.getElementById('carousel-track');
            const dotsContainer = document.getElementById('nav-dots');
            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            newsLibrary.forEach((article, index) => {
                // Build Card
                const card = document.createElement('div');
                card.className = 'carousel-card';
                card.id = `card-${index}`;

                const sourceUpper = article.source.toUpperCase();
                let logoHTML = sourceLogos[sourceUpper] 
                    ? `<img src="${sourceLogos[sourceUpper]}" class="card-logo" alt="${article.source}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"/>
                       <div class="card-source-text" style="display:none;">${article.source}</div>`
                    : `<div class="card-source-text">${article.source}</div>`;

                card.innerHTML = `
                    ${logoHTML}
                    <div class="card-title">${article.title}</div>
                    <div class="card-category">${article.category}</div>
                `;
                track.appendChild(card);

                // Build Dots (Max 12 dots so it doesn't overflow)
                if(index < 12) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dot.id = `dot-${index}`;
                    dot.onclick = () => jumpToCard(index);
                    dotsContainer.appendChild(dot);
                }
            });

            document.getElementById('carousel-controls').style.display = 'flex';
            updateScreen();
        }

        function moveCarousel(direction) {
            currentIndex = (currentIndex + direction + newsLibrary.length) % newsLibrary.length;
            updateScreen();
            resetAutoPlay(); // Reset timer if user manually clicks
        }

        function jumpToCard(index) {
            currentIndex = index;
            updateScreen();
            resetAutoPlay();
        }

        function updateScreen() {
            if (newsLibrary.length === 0) return;
            const len = newsLibrary.length;

            // 1. Update 3D Cards
            const cards = document.querySelectorAll('.carousel-card');
            cards.forEach((card, i) => {
                card.className = 'carousel-card'; // reset
                if (i === currentIndex) {
                    card.classList.add('active');
                } else if (i === (currentIndex - 1 + len) % len) {
                    card.classList.add('prev');
                } else if (i === (currentIndex + 1) % len) {
                    card.classList.add('next');
                } else {
                    // Decide if it hides to the left or right
                    let diff = i - currentIndex;
                    if(diff < 0) diff += len; // normalize
                    if(diff < len/2) card.classList.add('hidden-right');
                    else card.classList.add('hidden-left');
                }
            });

            // 2. Update Dots
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('active');
                // Map current index to dot space if > 12 articles
                const dotTarget = currentIndex % Math.min(len, 12);
                if (i === dotTarget) dot.classList.add('active');
            });

            // 3. Update Sidebar Queue (Keep this feature!)
            let queueHTML = '';
            const indices = [ currentIndex, (currentIndex + 1) % len, (currentIndex + 2) % len, (currentIndex + 3) % len, (currentIndex + 4) % len, (currentIndex + 5) % len, (currentIndex + 6) % len ];
            
            indices.forEach((idx, i) => {
                let a = newsLibrary[idx];
                let activeClass = (i === 0) ? 'active' : '';
                let srcUpper = a.source.toUpperCase();
                let logoHTML = sourceLogos[srcUpper] 
                    ? `<img src="${sourceLogos[srcUpper]}" class="network-logo" alt="${a.source}" onerror="this.style.display='none';"/> <span class="logo-separator" style="margin:0 6px;">|</span> <span class="network-name-text" style="font-size:0.7rem;">${a.source}</span>`
                    : `<span class="network-name-text" style="font-size:0.7rem;">${a.source}</span>`;

                queueHTML += `
                    <div class="queue-item ${activeClass}">
                        <div class="queue-source">${logoHTML} &nbsp;&bull;&nbsp; ${a.category}</div>
                        <div class="queue-title">${a.title}</div>
                    </div>`;
            });
            document.getElementById('queue-list').innerHTML = queueHTML;
        }

        function resetAutoPlay() {
            if (broadcastTimer) clearInterval(broadcastTimer);
            broadcastTimer = setInterval(() => {
                if (newsLibrary.length > 0) {
                    currentIndex = (currentIndex + 1) % newsLibrary.length;
                    updateScreen();
                }
            }, 10000); // Rotates every 10 seconds automatically
        }

        async function fetchAllNews() {
            const shuffledFeeds = feeds.sort(() => 0.5 - Math.random()).slice(0, 8);
            let allArticles = [];

            for (const feed of shuffledFeeds) {
                try {
                    const response = await fetchWithTimeout(rss2jsonProxy + encodeURIComponent(feed.url), { timeout: 5000 });
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'ok') {
                            const items = data.items.slice(0, 4).map(item => {
                                return {
                                    title: item.title,
                                    category: feed.category,
                                    source: feed.source
                                };
                            });
                            allArticles.push(...items);
                        }
                    }
                } catch (error) {}
            }

            if (allArticles.length > 0) {
                newsLibrary = allArticles.sort(() => Math.random() - 0.5);
                tickerItems = newsLibrary.map(a => `${a.source.toUpperCase()}: ${a.title}`);
                currentIndex = 0; 
                
                initializeCarouselDOM();
                setInterval(rotateTicker, 5000); 
                resetAutoPlay();
            } else {
                setTimeout(fetchAllNews, 15000); 
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 30000); 
        setInterval(fetchAllNews, 1800000); // Refetch feeds every 30 mins
        fetchAllNews();

    </script>
</body>
</html>
