<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNews Broadcast</title>
    <link rel="stylesheet" href="style.css">
    <!-- Modern, clean broadcast fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Outfit:wght@300;400;600&family=Teko:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Outer TV Bezel - Now Widescreen -->
    <div class="tv-bezel">
        <div class="crt-screen">
            
            <!-- Lightened Screen Effects -->
            <div class="scanlines"></div>
            <div class="glare"></div>
            
            <div class="live-indicator">
                <div class="red-dot"></div>
                LIVE AGGREGATOR
            </div>

            <!-- Main Widescreen Layout -->
            <div class="broadcast-layout">
                
                <!-- Left: Main Story Feature -->
                <div class="main-story">
                    <div class="story-image-container">
                        <img id="news-image" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop" alt="News Image">
                        <div class="image-overlay"></div>
                    </div>
                    
                    <div class="story-content">
                        <div class="meta-tags">
                            <span class="category-badge" id="news-category">LOADING</span>
                            <span class="source-badge" id="news-source">NETWORK</span>
                        </div>
                        <h1 id="news-headline">Establishing satellite link...</h1>
                        <p id="news-description">Please stand by as we aggregate global data feeds from verified sources.</p>
                        <div class="timestamp" id="news-time">00:00</div>
                    </div>
                </div>

                <!-- Right: Upcoming News Queue -->
                <div class="sidebar">
                    <div class="sidebar-header">
                        <span><i class="fa-solid fa-list"></i> UPCOMING IN QUEUE</span>
                    </div>
                    <div class="upcoming-list" id="upcoming-list">
                        <!-- Populated by JS -->
                        <div class="upcoming-item">Loading data...</div>
                    </div>
                </div>

            </div>

            <!-- Scrolling Ticker Tape (Slowed Down) -->
            <div class="ticker-tape">
                <div class="ticker-text" id="ticker-text">
                    INITIALIZING BROADCAST NODE // CONNECTING TO RSS MAINFRAME // STAND BY...
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
