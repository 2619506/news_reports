<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWEN News Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Left Sidebar: Queue & Weather -->
        <aside class="sidebar">
            <div class="queue-header"><span class="dot green"></span> Good <span>QUEUE</span></div>
            <div id="news-queue" class="news-list">
                <!-- Sidebar news items inject here -->
            </div>
            
            <div class="weather-module">
                <div class="weather-header">GLOBAL DATABANKS</div>
                <div class="weather-data">
                    <span id="weather-city">PARIS</span>
                    <span id="weather-temp">31°C</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="tags">
                    <span class="tag cyan">BUSINESS</span>
                    <span class="tag white">FORBES</span>
                </div>
                
                <!-- Logo Container (Date successfully removed) -->
                <div class="swen-logo-container">
                    <div class="swen-logo">SWEN <span>NEWS</span></div>
                </div>
            </header>

            <article class="featured-story">
                <h1 id="main-headline">Dodgers Veteran Cuts Ties With Team Just Before Tarik Skubal Trade</h1>
                <div class="description-box">
                    <p id="main-description">The Los Angeles Dodgers lost a 30-year-old southpaw hours before their acquisition of the Detroit Tigers' superstar ace was announced.</p>
                </div>
            </article>
        </main>
    </div>
    
    <!-- Red Bottom Ticker -->
    <div class="bottom-ticker"></div>

    <script src="script.js"></script>
</body>
</html>
